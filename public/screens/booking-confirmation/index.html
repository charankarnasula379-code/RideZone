<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Booking Confirmed — RideZone Reservation Confirmation">
  <title>Booking Confirmed — RideZone</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/screens/booking-confirmation/booking-confirmation.css">
</head>
<body>

  <!-- Top Header with Single-Arrow Back Button (Confirmation -> Back to Vehicles) -->
  <header class="fullpage-header">
    <a href="/vehicles" class="fullpage-back-btn" id="confirmBackBtn" aria-label="Back to vehicles">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      <span>Back to Vehicles</span>
    </a>
    <a href="/" class="fullpage-brand-link" aria-label="RideZone Home">
      <img src="/assets/logo.png" alt="RideZone" class="fullpage-logo-img" width="88" height="44">
    </a>
  </header>

  <main class="fullpage-container">
    <div class="confirm-wrap">
      <div class="confirm-icon-circle-large">
        <svg viewBox="0 0 24 24" width="38" height="38" fill="currentColor">
          <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
        </svg>
      </div>

      <div class="fullpage-page-header">
        <span class="eyebrow">RESERVATION CONFIRMED</span>
        <h1 id="confirmTitle">Booking Confirmed</h1>
        <p class="confirm-subtitle">✓ Payment Successful (Demo)</p>
      </div>

      <div class="confirm-details-box" id="confirmDetailsBox">
        <!-- Populated dynamically by booking-confirmation.js -->
      </div>

      <div class="confirm-actions">
        <a href="/screens/profile/index.html" class="primary-button" id="confirmViewProfileBtn">
          View in Profile &rarr;
        </a>
        <a href="/vehicles" class="secondary-button confirm-done-btn">
          Done / Return to Vehicles
        </a>
      </div>
    </div>
  </main>

  <script src="/screens/booking-confirmation/booking-confirmation.js"></script>
</body>
</html>
